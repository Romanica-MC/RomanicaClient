name: Release

# Publishes a client release from a v* tag, only after the evidence AGENTS.md asks for:
# the built jar reports the tag's version, the unit tests pass, and the full client
# gametest suite boots the game and passes. The launcher's distribution index then
# pins the attached jar (scripts/generate-distro.cjs in RomanicaLauncher).
#
# Two ways in: pushing a v* tag, or running this workflow by hand on main, which
# releases the version in gradle.properties and has GitHub create the tag on that
# commit. (Tag pushes from the cloud agent sessions are refused by their git proxy.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            [ "$GITHUB_REF_NAME" = main ] || { echo "release by hand only from main, not $GITHUB_REF_NAME" >&2; exit 1; }
            tag="v$(sed -n 's/^version=//p' gradle.properties)"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $tag already exists; bump the version first" >&2; exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (includes unit tests)
        run: ./gradlew :latest:build

      - name: Check fabric.mod.json version against the tag
        run: |
          shopt -s nullglob
          jars=()
          for jar in versions/latest/build/libs/*.jar; do
            case "$jar" in *-sources.jar) ;; *) jars+=("$jar") ;; esac
          done
          [ "${#jars[@]}" -eq 1 ] || { echo "expected exactly one mod jar, found ${#jars[@]}" >&2; exit 1; }
          scripts/check-release-version.sh "${{ steps.tag.outputs.tag }}" "${jars[@]}"
          sha256sum "${jars[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: |
            versions/latest/build/libs/*.jar
            !versions/latest/build/libs/*-sources.jar
          if-no-files-found: error

  gametest:
    name: Gametest (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Install GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1

      - name: Client gametests
        timeout-minutes: 30
        env:
          SDL_VIDEO_DRIVER: offscreen
          EGL_PLATFORM: surfaceless
        run: ./gradlew :latest:runClientGameTest

      # Same gate as ci.yml: a release must never pass a gametest run that executed
      # zero or fewer tests than the suite registers (#24).
      - name: Gametest count and summary
        if: always()
        env:
          ENTRYPOINTS: versions/latest/src/test/resources/fabric.mod.json
          COUNT_FILE: versions/latest/build/run/clientGameTest/gametests-executed.txt
        run: |
          expected=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["entrypoints"]["fabric-client-gametest"]))' "$ENTRYPOINTS")
          if [ -f "$COUNT_FILE" ]; then
            executed=$(grep -c . "$COUNT_FILE") || executed=0
          else
            executed=0
            echo "gametest count file missing: the suite never recorded a single test" >&2
          fi
          {
            echo "### Gametest summary (release)"
            echo ""
            echo "Executed client gametests: $executed of $expected expected"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "executed=$executed expected=$expected"
          if [ "$executed" -lt 1 ]; then
            echo "ZERO client gametests executed - failing the job (#24: a zero-test run must not go green)" >&2
            exit 1
          fi
          if [ "$executed" -lt "$expected" ]; then
            echo "Only $executed of $expected expected client gametests executed" >&2
            exit 1
          fi

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gametest-run
          path: |
            versions/latest/build/run/clientGameTest/screenshots/
            versions/latest/build/run/clientGameTest/logs/
            versions/latest/build/run/clientGameTest/gametests-executed.txt
          if-no-files-found: ignore

  publish:
    name: Publish the release
    needs: [build, gametest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: dist

      - name: Create the GitHub release with the jar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Romanica Client ${TAG#v}" \
            --generate-notes
