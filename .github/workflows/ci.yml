name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :latest:build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: RomanicaClient-jar
          path: versions/latest/build/libs/*.jar

  # Sign-in tokens are sealed with Windows DPAPI (TokenVault). Only a Windows runner
  # can prove the seal really happens and opens again; on Linux those tests are skipped.
  windows-token-storage:
    name: Token storage (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Token storage tests
        shell: bash
        run: ./gradlew :latest:test --tests "*AccountsTokenStorageTest*" --tests "*AccountClientIdTest*"

      - name: Fail if the DPAPI tests did not run
        shell: bash
        run: |
          f=versions/latest/build/test-results/test/TEST-io.github.axolotlclient.modules.auth.AccountsTokenStorageTest.xml
          test -f "$f" || { echo "no test report"; exit 1; }
          grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          grep -q 'testcase name="windowsFileHoldsNoReadableToken' "$f"
          if grep -A1 'testcase name="windows' "$f" | grep -q '<skipped'; then echo "DPAPI tests were skipped"; exit 1; fi

  # The full client gametest suite boots a real Minecraft client, creates and joins
  # singleplayer worlds and takes screenshots. It runs under SDL's offscreen video
  # driver on Mesa (llvmpipe) with no X server; under xvfb the 26.x client never
  # booted ("Couldn't find matching GLX visual"). About 4 minutes per run.
  gametest:
    name: Gametest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1

      # SDL's offscreen video driver renders through Mesa EGL (llvmpipe) with no X
      # server. Under xvfb the 26.x client never booted ("Couldn't find matching GLX
      # visual"); offscreen boots in seconds (run 40439686175).
      - name: Client gametests (full suite)
        timeout-minutes: 30
        env:
          SDL_VIDEO_DRIVER: offscreen
          EGL_PLATFORM: surfaceless
        run: ./gradlew :latest:runClientGameTest

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-run
          path: |
            versions/latest/build/run/clientGameTest/screenshots/
            versions/latest/build/run/clientGameTest/logs/
          if-no-files-found: ignore
