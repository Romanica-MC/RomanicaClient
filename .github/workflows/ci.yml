name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :latest:build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: RomanicaClient-jar
          path: versions/latest/build/libs/*.jar

  # Sign-in tokens are sealed with Windows DPAPI (TokenVault). Only a Windows runner
  # can prove the seal really happens and opens again; on Linux those tests are skipped.
  windows-token-storage:
    name: Token storage (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Token storage tests
        shell: bash
        run: ./gradlew :latest:test --tests "*AccountsTokenStorageTest*" --tests "*AccountClientIdTest*"

      - name: Fail if the DPAPI tests did not run
        shell: bash
        run: |
          f=versions/latest/build/test-results/test/TEST-io.github.axolotlclient.modules.auth.AccountsTokenStorageTest.xml
          test -f "$f" || { echo "no test report"; exit 1; }
          grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          grep -q 'testcase name="windowsFileHoldsNoReadableToken' "$f"
          if grep -A1 'testcase name="windows' "$f" | grep -q '<skipped'; then echo "DPAPI tests were skipped"; exit 1; fi

  # The client gametest spins a real Minecraft client. GitHub's ubuntu runners
  # have no GPU, so this runs under xvfb with mesa's software GL (llvmpipe),
  # which renders roughly 20x slower than a real GPU: the full suite needs
  # over an hour here and cannot finish. CI therefore runs the headless "ci"
  # subset instead (-Pimperium.fastGametests): the logic/protocol tests that
  # need no world rendering (ImperiumGametestSubsets in the test source set
  # picks the subset; the framework itself can only filter whole mods). The
  # subset boots the client once, runs no worlds, and completes in minutes —
  # no continue-on-error needed. The full suite (all tests, screenshots) stays
  # the default locally on a real GPU and runs before every release.
  # Manual-only: the full client BOOT under mesa software GL takes longer than
  # any practical job budget on 2-core runners (measured: a 75-second local
  # subset did not finish in 60 minutes headless; boot, not the tests, is the
  # wall). The required build job gates every push; the full gametest suite
  # runs locally on a real GPU before every release; extracting the pure
  # protocol/logic pins into plain JUnit for fast CI coverage is tracked in
  # the work order (issue #12).
  gametest:
    name: Gametest
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1

      # SDL's offscreen video driver renders through Mesa EGL (llvmpipe) with no X
      # server. Under xvfb the 26.x client never booted ("Couldn't find matching GLX
      # visual"); offscreen boots in seconds (run 40439686175).
      - name: Client gametests (full suite)
        timeout-minutes: 30
        env:
          SDL_VIDEO_DRIVER: offscreen
          EGL_PLATFORM: surfaceless
        run: ./gradlew :latest:runClientGameTest

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-run
          path: |
            versions/latest/build/run/clientGameTest/screenshots/
            versions/latest/build/run/clientGameTest/logs/
          if-no-files-found: ignore
