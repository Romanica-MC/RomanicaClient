name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :latest:build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: RomanicaClient-jar
          path: versions/latest/build/libs/*.jar

  # The client gametest spins a real Minecraft client. GitHub's ubuntu runners
  # have no GPU, so this runs under xvfb with mesa's software GL (llvmpipe),
  # which renders roughly 20x slower than a real GPU: the full suite needs
  # over an hour here and cannot finish. CI therefore runs the headless "ci"
  # subset instead (-Pimperium.fastGametests): the logic/protocol tests that
  # need no world rendering (ImperiumGametestSubsets in the test source set
  # picks the subset; the framework itself can only filter whole mods). The
  # subset boots the client once, runs no worlds, and completes in minutes —
  # no continue-on-error needed. The full suite (all tests, screenshots) stays
  # the default locally on a real GPU and runs before every release.
  # Manual-only: the full client BOOT under mesa software GL takes longer than
  # any practical job budget on 2-core runners (measured: a 75-second local
  # subset did not finish in 60 minutes headless; boot, not the tests, is the
  # wall). The required build job gates every push; the full gametest suite
  # runs locally on a real GPU before every release; extracting the pure
  # protocol/logic pins into plain JUnit for fast CI coverage is tracked in
  # the work order (issue #12).
  gametest:
    name: Gametest (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install display and GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 mesa-utils

      # 26.x opens its window through SDL3. Under xvfb, SDL's GLX path failed
      # with "Couldn't find matching GLX visual" and the client then sat at a
      # dead window until the 90-minute job limit (every dispatched run before
      # this was cancelled, not slow). EGL avoids GLX visual matching; mesa's
      # llvmpipe provides it. The step timeout turns a dead boot into a
      # failure in minutes instead of a silent cancel.
      - name: Client gametests (headless ci subset)
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEO_DRIVER: x11
          SDL_VIDEO_X11_FORCE_EGL: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" sh -c 'glxinfo -B | grep -E "OpenGL (renderer|version)"; ./gradlew :latest:runClientGameTest -Pimperium.fastGametests'

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-run
          path: |
            versions/latest/build/run/clientGameTest/screenshots/
            versions/latest/build/run/clientGameTest/logs/
          if-no-files-found: ignore
