name: Release check

# A release is only valid when the jar it ships reports the tag's version (beta.24 shipped a
# jar that said 0.1.0-alpha.1). Tag pushes check a fresh build; published releases check the
# jars actually attached, since those are uploaded by hand.
on:
  push:
    tags: ["v*"]
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  build-matches-tag:
    name: Built jar version matches tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :latest:build

      - name: Check fabric.mod.json version against the tag
        run: |
          shopt -s nullglob
          jars=()
          for jar in versions/latest/build/libs/*.jar; do
            case "$jar" in *-sources.jar) ;; *) jars+=("$jar") ;; esac
          done
          [ "${#jars[@]}" -gt 0 ] || { echo "no mod jar was built" >&2; exit 1; }
          scripts/check-release-version.sh "$GITHUB_REF_NAME" "${jars[@]}"

  assets-match-tag:
    name: Release assets match tag
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check every attached mod jar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir "$RUNNER_TEMP/assets"
          shopt -s nullglob
          jars=()
          for jar in "$RUNNER_TEMP"/assets/*.jar; do
            case "$jar" in *-sources.jar) ;; *) jars+=("$jar") ;; esac
          done
          [ "${#jars[@]}" -gt 0 ] || { echo "release $TAG has no mod jar attached" >&2; exit 1; }
          scripts/check-release-version.sh "$TAG" "${jars[@]}"
